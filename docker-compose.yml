version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reportflow
    ports:
      - "5440:5432"
    volumes:
      - pgdata3:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata3:
  redisdata:
